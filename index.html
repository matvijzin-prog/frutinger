<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frutinger 🍉</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #e2e8f0; margin: 0; padding: 0; height: 100dvh; overflow: hidden; }
        
        .app-container { display: flex; height: 100%; max-width: 1200px; margin: 0 auto; background: #ffffff; }

        /* ЛЕВАЯ ПАНЕЛЬ */
        .sidebar { width: 280px; background: #f1f5f9; border-right: 1px solid #cbd5e1; display: flex; flex-direction: column; transition: transform 0.3s ease; }
        .my-profile { padding: 15px; background: #ffffff; border-bottom: 1px solid #cbd5e1; display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #56ab2f; color: white; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; flex-shrink: 0; }
        .my-name { font-weight: bold; font-size: 16px; color: #1e293b; flex: 1; }
        .settings-btn { background: none; border: none; font-size: 20px; cursor: pointer; }
        .search-box { padding: 10px; }
        .search-box input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; background: #ffffff; font-size: 14px; }
        .contacts-list { flex: 1; overflow-y: auto; padding: 0 10px; }

        .contact-item { padding: 10px; border-radius: 8px; margin-bottom: 5px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .contact-item:hover { background: #e2e8f0; }
        .contact-item.active { background: #dcfce7; }
        .contact-info h4 { margin: 0; font-size: 15px; color: #1e293b; }
        .contact-info p { margin: 0; font-size: 12px; color: #64748b; }

        /* ЧАТ */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #ffffff; position: relative; }
        .chat-header { background: #ff6b6b; color: white; padding: 15px; display: flex; align-items: center; gap: 15px; font-size: 18px; font-weight: bold; }
        .menu-btn { display: none; background: none; border: none; color: white; font-size: 24px; cursor: pointer; }

        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-color: #f8fafc; }
        .message { padding: 10px 14px; border-radius: 15px; max-width: 75%; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); position: relative; }
        .message.my { background-color: #dcfce7; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.other { background-color: #ffffff; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #e2e8f0; }
        .name { font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 4px; }
        .msg-actions { margin-top: 5px; display: flex; gap: 10px; justify-content: flex-end; }
        .msg-actions button { background: none; border: none; cursor: pointer; font-size: 14px; opacity: 0.5; transition: 0.2s; }
        .msg-actions button:hover { opacity: 1; transform: scale(1.2); }

        .input-area { display: flex; padding: 15px; background: white; gap: 10px; align-items: center; border-top: 1px solid #e2e8f0; }
        .input-area input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #cbd5e1; font-size: 16px; }
        .input-area input:focus { outline: none; border-color: #56ab2f; }
        button.send-btn { background-color: #56ab2f; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; cursor: pointer; transition: 0.2s; }
        button.send-btn:hover { background-color: #3e8520; transform: scale(1.05); }
        .emoji-bar { display: flex; gap: 5px; padding: 5px 15px; background: #f1f5f9; overflow-x: auto; }
        .emoji-bar button { background: none; border: none; font-size: 22px; cursor: pointer; padding: 5px; flex-shrink: 0; }

        @media (max-width: 768px) {
            .sidebar { position: absolute; top: 0; bottom: 0; left: 0; width: 80%; z-index: 100; transform: translateX(-100%); box-shadow: 5px 0 15px rgba(0,0,0,0.1); }
            .sidebar.open { transform: translateX(0); }
            .menu-btn { display: block; }
            .overlay { position: absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index: 99; display: none; }
            .overlay.open { display: block; }
        }

        /* Модальное окно входа */
        #name-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; text-align: center; max-width: 320px; width: 100%; }
        .modal-content input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 10px; font-size: 16px; }
        .modal-content button { background: #56ab2f; color: white; border: none; padding: 14px 20px; border-radius: 10px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
        
        /* Уведомления */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 8px; z-index: 2000; opacity: 0; transition: opacity 0.3s; font-size: 14px; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <div id="name-modal">
        <div class="modal-content">
            <h2 style="margin-top:0; color:#56ab2f;">🍉 Frutinger 🍓</h2>
            <p style="color:#64748b; font-size:14px;">Только латиница и цифры</p>
            <input type="text" id="username" placeholder="Логин (например: matvey123)" maxlength="15">
            <input type="password" id="password" placeholder="Пароль" maxlength="20">
            <button onclick="login()">Войти / Создать</button>
        </div>
    </div>

    <div class="app-container" id="chat-app" style="display: none;">
        <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

        <div class="sidebar" id="sidebar">
            <div class="my-profile">
                <div class="avatar" id="my-avatar">?</div>
                <div class="my-name" id="my-name-display">Имя</div>
                <button class="settings-btn" onclick="logout()" title="Выйти">🚪</button>
            </div>
            
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Поиск контактов..." oninput="filterContacts()">
            </div>

            <div class="contacts-list" id="contacts-list">
                <div class="contact-item active" onclick="closeSidebar()">
                    <div class="avatar" style="background: #ff6b6b;">🍉</div>
                    <div class="contact-info">
                        <h4>Общий чат</h4>
                        <p>Все пользователи</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <span onclick="triggerFruitRain()" style="cursor:pointer;">🍉 Frutinger 🍓</span>
            </div>
            
            <div class="chat-box" id="chat-box"></div>
            
            <div class="emoji-bar">
                <button onclick="addEmoji('🍎')">🍎</button>
                <button onclick="addEmoji('🍌')">🍌</button>
                <button onclick="addEmoji('🍓')">🍓</button>
                <button onclick="addEmoji('🍉')">🍉</button>
                <button onclick="addEmoji('🍇')">🍇</button>
                <button onclick="addEmoji('😂')">😂</button>
            </div>

            <div class="input-area">
                <input type="text" id="message-input" placeholder="Напиши сообщение..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        let myName = localStorage.getItem('frutinger_name') || "";
        const API_URL = window.location.origin; 

        // Показ уведомлений
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        window.onload = () => {
            if (myName !== "") startApp();
        };

        async function login() {
            const nameInput = document.getElementById('username').value.trim();
            const passInput = document.getElementById('password').value.trim();

            // Проверка: только английские буквы и цифры
            const regex = /^[a-zA-Z0-9]+$/;
            if (!regex.test(nameInput)) {
                return showToast("Ошибка: в имени только английские буквы и цифры!");
            }
            if (passInput.length < 3) {
                return showToast("Ошибка: пароль слишком короткий!");
            }

            // Отправляем на сервер
            const response = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: nameInput, password: passInput })
            });
            const result = await response.json();

            if (result.status === "error") {
                showToast(result.message);
            } else {
                showToast(result.message);
                myName = nameInput;
                localStorage.setItem('frutinger_name', myName); 
                startApp();
            }
        }

        function logout() {
            localStorage.removeItem('frutinger_name');
            location.reload(); // Перезагружаем страницу
        }

        function startApp() {
            document.getElementById('name-modal').style.display = 'none';
            document.getElementById('chat-app').style.display = 'flex';
            
            document.getElementById('my-name-display').innerText = myName;
            document.getElementById('my-avatar').innerText = myName.charAt(0).toUpperCase();

            loadMessages(); 
            loadUsers(); 
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        function addEmoji(emoji) {
            const input = document.getElementById('message-input');
            input.value += emoji;
            input.focus();
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (text === "") return;
            input.value = ""; 

            await fetch(`${API_URL}/send`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: myName, text: text })
            });
            loadMessages(); 
        }

        async function loadMessages() {
            try {
                const response = await fetch(`${API_URL}/messages`);
                const messages = await response.json();
                const chatBox = document.getElementById('chat-box');
                const isScrolledToBottom = chatBox.scrollHeight - chatBox.clientHeight <= chatBox.scrollTop + 50;
                chatBox.innerHTML = ""; 

                messages.forEach(msg => {
                    const isMyMessage = msg.name === myName;
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${isMyMessage ? 'my' : 'other'}`;
                    const safeText = msg.text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    const safeName = msg.name.replace(/</g, "&lt;").replace(/>/g, "&gt;");

                    if (isMyMessage) {
                        msgDiv.innerHTML = `
                            <div class="name">${safeName}</div>
                            <div>${safeText}</div>
                            <div class="msg-actions">
                                <button onclick="editMessage(${msg.id}, '${msg.text.replace(/'/g, "\\'")}')">✏️</button>
                                <button onclick="deleteMessage(${msg.id})">🗑️</button>
                            </div>
                        `;
                    } else {
                        msgDiv.innerHTML = `<div class="name">${safeName}</div><div>${safeText}</div>`;
                    }
                    chatBox.appendChild(msgDiv);
                });

                if (isScrolledToBottom) chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) { console.error("Ошибка", error); }
        }

        async function loadUsers() {
            try {
                const response = await fetch(`${API_URL}/users`);
                const users = await response.json();
                const list = document.getElementById('contacts-list');

                let html = `
                <div class="contact-item active" onclick="closeSidebar()">
                    <div class="avatar" style="background: #ff6b6b;">🍉</div>
                    <div class="contact-info">
                        <h4>Общий чат</h4>
                        <p>Все пользователи</p>
                    </div>
                </div>`;

                users.forEach(user => {
                    if (user.username !== myName) {
                        html += `
                        <div class="contact-item contact-user" onclick="closeSidebar()">
                            <div class="avatar" style="background: #f59e0b;">${user.avatar}</div>
                            <div class="contact-info">
                                <h4>${user.username}</h4>
                                <p>${user.status}</p>
                            </div>
                        </div>`;
                    }
                });
                list.innerHTML = html;
            } catch (error) { console.error("Ошибка загрузки юзеров", error); }
        }

        function closeSidebar() {
            if (window.innerWidth < 768) toggleSidebar();
        }

        function filterContacts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.contact-user').forEach(contact => {
                const name = contact.querySelector('h4').innerText.toLowerCase();
                contact.style.display = name.includes(query) ? 'flex' : 'none';
            });
        }

        async function deleteMessage(id) {
            if (!confirm("Удалить это сообщение?")) return;
            await fetch(`${API_URL}/delete/${id}`, { method: 'DELETE' });
            loadMessages();
        }

        async function editMessage(id, oldText) {
            let newText = prompt("Редактировать сообщение:", oldText);
            if (newText === null || newText.trim() === "") return; 
            await fetch(`${API_URL}/edit/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: newText })
            });
            loadMessages();
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") sendMessage();
        }

        setInterval(() => {
            if(myName !== "") {
                loadMessages();
                loadUsers();
            }
        }, 2000);

        function triggerFruitRain() {
            const fruits = ['🍎', '🍌', '🍇', '🍓', '🍉', '🍊', '🍍', '🥝'];
            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    const fruit = document.createElement('div');
                    fruit.innerText = fruits[Math.floor(Math.random() * fruits.length)];
                    fruit.style.position = 'fixed'; fruit.style.left = Math.random() * 100 + 'vw'; fruit.style.top = '-50px';
                    fruit.style.fontSize = (Math.random() * 20 + 20) + 'px'; fruit.style.zIndex = '9999'; fruit.style.pointerEvents = 'none'; 
                    fruit.style.transition = 'top 3s linear, transform 3s linear';
                    document.body.appendChild(fruit);
                    setTimeout(() => { fruit.style.top = '100vh'; fruit.style.transform = `rotate(${Math.random() * 360}deg)`; }, 50);
                    setTimeout(() => fruit.remove(), 5000);
                }, i * 80); 
            }
        }
    </script>
</body>
</html>
