<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frutinger 🍉</title>
    <style>
        :root {
            --cheese: #FFC93C;
            --cheese-dark: #E0A800;
            --cheese-light: #FFF3C4;
            --bg: #FFFDF5;
            --panel: #FFFFFF;
            --text: #3A2E00;
            --muted: #8A7A45;
            --bubble-me: #FFE28A;
            --bubble-other: #F1F1F1;
            --border: #F0E2B0;
            --shadow: 0 6px 20px rgba(200,160,0,0.15);
        }
        body.dark {
            --bg: #1E1B12;
            --panel: #2A2618;
            --text: #F5E9C8;
            --muted: #B8A97A;
            --bubble-me: #6B5A1E;
            --bubble-other: #3A3524;
            --border: #443C22;
            --cheese-light: #3A3420;
            --shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; transition: background .3s, color .3s; }
        .hidden { display: none !important; }

        /* Экран входа */
        #auth { height: 100dvh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 30% 20%, var(--cheese-light), var(--bg) 70%); }
        .auth-card { background: var(--panel); padding: 40px 30px; border-radius: 24px; box-shadow: var(--shadow); text-align: center; width: 90%; max-width: 360px; border: 2px solid var(--border); }
        .auth-card h1 { font-size: 32px; margin-bottom: 6px; color: var(--cheese-dark); }
        .auth-card input { width: 100%; padding: 14px; border-radius: 14px; border: 2px solid var(--border); background: var(--bg); color: var(--text); font-size: 16px; outline: none; margin-bottom: 10px;}
        .auth-card button { width: 100%; padding: 14px; border: none; border-radius: 14px; background: var(--cheese); color: #3A2E00; font-weight: 700; font-size: 16px; cursor: pointer; }

        /* Приложение */
        #app { display: flex; height: 100dvh; }
        .sidebar { width: 300px; background: var(--panel); border-right: 2px solid var(--border); display: flex; flex-direction: column; }
        @media (max-width: 768px) {
            .sidebar { position: absolute; top:0; bottom:0; left:0; width: 80%; z-index: 100; transform: translateX(-100%); transition: 0.3s; box-shadow: 5px 0 15px rgba(0,0,0,0.1);}
            .sidebar.open { transform: translateX(0); }
            .menu-btn { display: block !important; }
        }
        .brand { padding: 16px; font-weight: 800; font-size: 20px; color: var(--cheese-dark); border-bottom: 2px solid var(--border); display: flex; justify-content: space-between; align-items: center;}
        .list { flex: 1; overflow-y: auto; padding: 10px; }
        .list-title { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; margin: 10px 0 5px 10px; }
        .list-item { padding: 10px; border-radius: 12px; margin-bottom: 2px; display: flex; align-items: center; gap: 10px; }
        .list-item.active { background: var(--cheese-light); }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--cheese); color: #3A2E00; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
        .contact-info h4 { margin: 0; font-size: 14px; }
        .contact-info p { margin: 0; font-size: 12px; color: var(--muted); }
        .actions { padding: 10px; border-top: 2px solid var(--border); display: flex; gap: 8px; }
        .actions button { flex: 1; padding: 10px; border: none; border-radius: 12px; background: var(--cheese); color: #3A2E00; font-weight: 700; cursor: pointer; font-size: 13px;}

        .chat { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
        .chat-header { padding: 14px; background: var(--panel); border-bottom: 2px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .chat-header h2 { font-size: 17px; color: var(--cheese-dark); }
        .menu-btn { display: none; background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text); }
        .theme-toggle { background: var(--cheese-light); border: none; padding: 8px; border-radius: 12px; cursor: pointer; font-size: 16px; color: var(--text); }
        
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-wrap: break-word; position: relative; }
        .msg.me { align-self: flex-end; background: var(--bubble-me); border-bottom-right-radius: 4px; }
        .msg.other { align-self: flex-start; background: var(--bubble-other); border-bottom-left-radius: 4px; }
        .msg .author { font-size: 11px; font-weight: 700; color: var(--cheese-dark); margin-bottom: 2px; }
        .msg .meta { font-size: 10px; color: var(--muted); margin-top: 4px; text-align: right; }
        
        .msg-actions { display: none; position: absolute; top: 50%; transform: translateY(-50%); right: -50px; gap: 5px; }
        .msg:hover .msg-actions { display: flex; }
        .msg-actions button { background: var(--panel); border: 1px solid var(--border); cursor: pointer; border-radius: 50%; width: 28px; height: 28px; font-size: 12px; }

        .composer { display: flex; gap: 8px; padding: 12px; background: var(--panel); border-top: 2px solid var(--border); }
        .composer input { flex: 1; padding: 12px; border-radius: 14px; border: 2px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; outline: none; }
        .composer button { padding: 0 16px; height: 44px; border: none; border-radius: 14px; background: var(--cheese); color: #3A2E00; font-weight: 700; cursor: pointer; font-size: 18px; }
        
        .emoji-bar { display: flex; gap: 5px; padding: 5px 12px; background: var(--cheese-light); overflow-x: auto; }
        .emoji-bar button { background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px; }

        .cheese-snow { position: fixed; top: -20px; font-size: 24px; pointer-events: none; z-index: 999; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>

<div id="auth">
    <div class="auth-card">
        <h1>🍉 Frutinger</h1>
        <input id="nickInput" placeholder="Ник (латиница)" maxlength="15">
        <button onclick="login()">Войти</button>
    </div>
</div>

<div id="app" class="hidden">
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <span>🍉 Frutinger</span>
            <span id="meBadge" style="font-size:12px; font-weight:500;">@ник</span>
        </div>
        <div class="list" id="userList">
            <div class="list-title">Общий чат</div>
            <div class="list-item active" onclick="switchChat('general')">
                <div class="avatar">🍉</div>
                <div class="contact-info"><h4>Общий чат</h4><p>Все пользователи</p></div>
            </div>
            <div class="list-title" style="margin-top:15px;">Друзья</div>
        </div>
        <div class="actions">
            <button onclick="toggleTheme()">🌙 Тема</button>
            <button onclick="logout()">🚪 Выйти</button>
        </div>
    </aside>

    <main class="chat">
        <div class="chat-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <h2 id="chatTitle" style="cursor:pointer;" onclick="triggerFruitRain()">Общий чат</h2>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </div>
        <div class="messages" id="messages"></div>
        
        <div class="emoji-bar">
            <button onclick="addEmoji('🍎')">🍎</button>
            <button onclick="addEmoji('🍌')">🍌</button>
            <button onclick="addEmoji('🍓')">🍓</button>
            <button onclick="addEmoji('🍉')">🍉</button>
            <button onclick="addEmoji('🍇')">🍇</button>
            <button onclick="addEmoji('😂')">😂</button>
            <button onclick="addEmoji('❤️')">❤️</button>
        </div>

        <div class="composer">
            <input id="msgInput" placeholder="Сообщение..." disabled onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" id="sendBtn" disabled>➤</button>
        </div>
    </main>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    // --- ПРЯМОЕ ПОДКЛЮЧЕНИЕ К SUPABASE (без прокси) ---
    const SUPABASE_URL = "https://chgdjipkycyvcmouurhh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_iJAQe3lvVpep6kMJ0U7i4w_zdx_Wwsw";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    let myName = localStorage.getItem('frutinger_name') || "";
    let theme = localStorage.getItem('frutinger_theme') || 'light';
    let currentChat = "general";

    // Тема
    window.toggleTheme = function() {
        theme = theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('frutinger_theme', theme);
        document.body.classList.toggle('dark', theme === 'dark');
    }
    document.body.classList.toggle('dark', theme === 'dark');

    window.toggleSidebar = function() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    // Вход
    window.login = function() {
        const nick = document.getElementById('nickInput').value.trim();
        if (!/^[A-Za-z0-9_]{3,15}$/.test(nick)) return alert("Только латиница, цифры и _, 3-15 символов");
        myName = nick;
        localStorage.setItem('frutinger_name', myName);
        startApp(); 
    }

    window.logout = function() {
        localStorage.removeItem('frutinger_name');
        location.reload();
    }

    function startApp() {
        document.getElementById('auth').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('meBadge').textContent = '@' + myName;
        document.getElementById('msgInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        
        loadMessages();
        loadUsers();
        
        // Слушаем новые сообщения
        supabase.channel('custom-all-channel')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, payload => {
            loadMessages();
          })
          .subscribe();
    }

    async function loadMessages() {
        const { data, error } = await supabase
            .from('messages')
            .select('*')
            .order('created_at', { ascending: true });

        if (error) { console.error("Load error:", error); return; }

        const box = document.getElementById('messages');
        box.innerHTML = "";
        
        data.forEach(m => {
            const isMe = m.name === myName;
            const div = document.createElement('div');
            div.className = `msg ${isMe ? 'me' : 'other'}`;
            div.id = `msg-${m.id}`;
            
            let content = "";
            if (!isMe) content += `<div class="author">@${m.name}</div>`;
            content += `<div class="text">${m.text}</div>`;
            
            if (isMe) {
                content += `
                <div class="msg-actions">
                    <button onclick="editMessage(${m.id}, '${m.text.replace(/'/g, "\\'")}')">✏️</button>
                    <button onclick="deleteMessage(${m.id})">🗑️</button>
                </div>`;
            }
            
            div.innerHTML = content;
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    }

    async function loadUsers() {
        const { data, error } = await supabase.from('messages').select('name');
        if (error) return;
        
        const uniqueUsers = [...new Set(data.map(m => m.name))].filter(u => u !== myName);
        const list = document.getElementById('userList');
        
        const oldFriends = list.querySelectorAll('.friend-item');
        oldFriends.forEach(el => el.remove());
        
        uniqueUsers.forEach(u => {
            const div = document.createElement('div');
            div.className = 'list-item friend-item';
            div.innerHTML = `<div class="avatar" style="background:#f59e0b;">${u[0].toUpperCase()}</div><div class="contact-info"><h4>${u}</h4><p>В сети</p></div>`;
            list.appendChild(div);
        });
    }

    window.sendMessage = async function() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        
        const { error } = await supabase.from('messages').insert([{ name: myName, text: text }]);
        if (error) {
            console.error("Send error:", error);
            alert("Ошибка отправки! Проверь консоль (F12).");
        }
    }

    window.editMessage = async function(id, oldText) {
        const newText = prompt("Редактировать сообщение:", oldText);
        if (newText === null || newText.trim() === "") return;
        await supabase.from('messages').update({ text: newText }).eq('id', id);
        loadMessages();
    }

    window.deleteMessage = async function(id) {
        if (!confirm("Удалить сообщение?")) return;
        await supabase.from('messages').delete().eq('id', id);
        loadMessages();
    }

    window.addEmoji = function(emoji) {
        const input = document.getElementById('msgInput');
        input.value += emoji;
        input.focus();
    }

    window.handleKeyPress = function(e) {
        if (e.key === 'Enter') sendMessage();
    }

    window.triggerFruitRain = function() {
        const fruits = ['🍎', '🍌', '🍇', '🍓', '🍉', '🍊', '🍍', '🥝'];
        for (let i = 0; i < 30; i++) {
            setTimeout(() => {
                const fruit = document.createElement('div');
                fruit.className = 'cheese-snow';
                fruit.innerText = fruits[Math.floor(Math.random() * fruits.length)];
                fruit.style.left = Math.random() * 100 + 'vw';
                fruit.style.fontSize = (Math.random() * 20 + 20) + 'px';
                fruit.style.animationDuration = (2 + Math.random() * 2) + 's';
                fruit.style.animationDelay = (Math.random() * 0.5) + 's';
                document.body.appendChild(fruit);
                setTimeout(() => fruit.remove(), 5000);
            }, i * 50);
        }
    }

    if (myName) startApp();
</script>
</body>
</html>
